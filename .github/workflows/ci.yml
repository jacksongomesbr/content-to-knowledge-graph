name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Markdown parser
        run: python -m pip install -r references/requirements-core.txt
      - name: Verify Markdown and FTS5 runtime
        run: python scripts/prepare_environment.py --check --profile core
      - name: Validate Agent Skills contract
        run: python scripts/validate_skill.py . --json
      - name: Compile scripts
        run: python -m compileall -q scripts
      - name: Run offline behavior tests
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Validate canonical example and build index
        run: |
          python scripts/knowledge.py validate examples
          python scripts/knowledge.py build examples
          python scripts/validate_graph.py examples/.generated/graph.json --layout examples/.generated/layout.json

  viewer:
    name: Browser viewer build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: assets/viewer/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --prefix assets/viewer
      - name: Test viewer utilities
        run: npm test --prefix assets/viewer
      - name: Typecheck and compile
        run: npm run build --prefix assets/viewer
